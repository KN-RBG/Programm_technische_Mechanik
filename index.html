<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TM-Draw 0.3.3</title><link rel="stylesheet" href="css/style.css"><script defer src="js/symbols.js?v=030"></script><script defer src="js/editor.js?v=033"></script></head><body>
<header><strong>TM-Draw · Technische Mechanik</strong><button id="save">Speichern</button><button id="load">Öffnen</button><input id="file" type="file" accept=".json" hidden><button id="duplicate">Duplizieren</button><button id="delete">Löschen</button><label><input id="snap" type="checkbox" checked> Rasterfang</label><label><input id="gridToggle" type="checkbox" checked> Raster</label><label>Kraftmaßstab: <input id="forceScale" type="number" min="0.01" step="any" value="50" style="width:75px"> N/Kästchen</label><label><input id="objectSnap" type="checkbox" checked> Bauteilfang</label><label>Längenmaßstab: <input id="lengthScale" type="number" min="0.000000001" step="any" value="0.5" style="width:75px"> <select id="lengthUnit"><option>mm</option><option>cm</option><option selected>m</option></select>/Kästchen</label><button id="undo" title="Strg+Z">↶ Rückgängig</button><button id="redo" title="Strg+Y">↷ Wiederholen</button><button id="fit">Gesamtansicht</button><label>Zoom: <input id="zoom" type="number" min="10" max="1000" value="100" style="width:65px"> %</label></header>
<main><aside><h2>Symbolbibliothek</h2><div id="palette"></div><p>Symbol hineinziehen oder anklicken und auf der Zeichenfläche platzieren.</p></aside><section><svg id="canvas" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e0e5eb"/></pattern></defs><rect width="1000" height="650" fill="white"/><rect id="gridLayer" width="1000" height="650" fill="url(#grid)"/><g id="scene"></g></svg></section><aside><h2>Eigenschaften</h2><div id="properties">Kein Element ausgewählt.</div><p id="status">Version 0.3.3</p></aside></main></body></html>
